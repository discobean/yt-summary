<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YT Hover Summary — Settings</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 16px;
      width: 340px;
      background: #1c1c1c;
      color: #eee;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid #444;
      margin-bottom: 14px;
    }
    .tab {
      border: none;
      background: none;
      color: #aaa;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab:hover {
      color: #fff;
    }
    .tab-active {
      color: #3ea6ff;
      border-bottom-color: #3ea6ff;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-weight: 500;
    }
    input,
    select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 7px 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      padding: 7px 16px;
      border: none;
      border-radius: 6px;
      background: #3ea6ff;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-left: 8px;
      color: #7bd88f;
    }
    .row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button.secondary {
      background: #3a3a3a;
      color: #eee;
      font-weight: 500;
    }
    #cacheStatus {
      color: #999;
      font-size: 12px;
    }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }
    section .hint {
      margin-top: 0;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      margin: 2px 0 12px;
    }
    .check input {
      display: inline-block;
      width: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>YT Hover Summary</h1>

  <div class="tabs">
    <button class="tab" data-provider="anthropic">Anthropic</button>
    <button class="tab" data-provider="gemini">Gemini</button>
  </div>

  <section data-panel="anthropic">
    <label>
      Anthropic API key
      <input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off" />
    </label>
    <label>
      Model
      <select id="model">
        <option value="claude-haiku-4-5">Claude Haiku 4.5 — fastest, cheapest (default)</option>
        <option value="claude-sonnet-5">Claude Sonnet 5 — better, a bit pricier</option>
        <option value="claude-opus-5">Claude Opus 5 — best quality, priciest</option>
      </select>
    </label>
    <p class="hint">Get a key at console.anthropic.com → Settings → API keys.</p>
  </section>

  <section data-panel="gemini" hidden>
    <label>
      Gemini API key
      <input type="password" id="geminiApiKey" placeholder="AIza…" autocomplete="off" />
    </label>
    <label>
      Model
      <select id="geminiModel">
        <option value="gemini-flash-latest">Gemini Flash (latest) — free-tier friendly (default)</option>
        <option value="gemini-pro-latest">Gemini Pro (latest) — best</option>
        <option value="gemini-flash-lite-latest">Gemini Flash-Lite (latest) — cheapest</option>
        <option value="gemini-3-pro-preview">Gemini 3 Pro (preview, pinned)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (pinned)</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (pinned)</option>
      </select>
    </label>
    <p class="hint">Get a key at aistudio.google.com → Get API key.</p>
  </section>

  <label class="check">
    <input type="checkbox" id="sendThumbnail" checked />
    Send the video thumbnail image to the AI provider
  </label>

  <button id="save">Save &amp; use this provider</button><span id="status"></span>

  <div class="row">
    <button id="clearCache" class="secondary">Clear summary cache</button>
    <span id="cacheStatus"></span>
  </div>

  <p class="hint">
    Keys are stored in chrome.storage.local on this machine only and are sent
    only to the selected provider's API. Summaries are cached on-device so
    repeat clicks are free.
  </p>

  <script src="options.js"></script>
</body>
</html>
